name: Publish iOSLibraries graphify knowledge graphs

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'graphify-libs/**'
      - '.github/workflows/graphify-libs-pages.yml'

permissions:
  contents: write

concurrency:
  group: ioslibraries-graphify-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -f graphify-libs/index.html
          cp -R graphify-libs _pages
          cd _pages
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish iOSLibraries graphify knowledge graphs"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
